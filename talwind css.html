<!doctype html>
<html>
  <head>
    <title>Flexbox Layout</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100">
    <!-- Navbar -->
    <nav class="bg-blue-600 text-white flex justify-between items-center p-5">
      <h1 class="text-3xl font-bold">FlexBox</h1>

      <div class="space-x-5">
        <a href="">Home</a>
        <a href="">Services</a>
        <a href="">Contact</a>
      </div>
    </nav>

    <!-- Flexbox Layout -->
    <div class="flex flex-wrap justify-center gap-8 p-10">
      <!-- Card 1 -->
      <div class="bg-white w-72 p-5 rounded-xl shadow-lg">
        <img src="https://picsum.photos/300/200?1" class="rounded-lg w-full" />

        <h2 class="text-2xl font-bold mt-4">Nature</h2>

        <p class="mt-2 text-gray-600">
          Beautiful nature scenery with mountains.
        </p>

        <button class="bg-blue-500 text-white px-4 py-2 rounded-lg mt-4">
          Explore
        </button>
      </div>

      <!-- Card 2 -->
      <div class="bg-white w-72 p-5 rounded-xl shadow-lg">
        <img src="https://picsum.photos/300/200?2" class="rounded-lg w-full" />

        <h2 class="text-2xl font-bold mt-4">Beach</h2>

        <p class="mt-2 text-gray-600">
          Relaxing beach view and fresh atmosphere.
        </p>

        <button class="bg-green-500 text-white px-4 py-2 rounded-lg mt-4">
          Visit
        </button>
      </div>

      <!-- Card 3 -->
      <div class="bg-white w-72 p-5 rounded-xl shadow-lg">
        <img src="https://picsum.photos/300/200?3" class="rounded-lg w-full" />

        <h2 class="text-2xl font-bold mt-4">Forest</h2>

        <p class="mt-2 text-gray-600">
          Green forest with peaceful environment.
        </p>

        <button class="bg-red-500 text-white px-4 py-2 rounded-lg mt-4">
          Discover
        </button>
      </div>
    </div>
  </body>
</html>
