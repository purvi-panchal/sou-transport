<!doctype html>
<html>
  <head>
    <title>Bootstrap Registration Form</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <style>
      input,
      select {
        width: 100%;

        padding: 10px;

        margin-top: 5px;

        border: 1px solid gray;

        border-radius: 5px;
      }

      button {
        width: 100%;

        padding: 10px;

        background: blue;

        color: white;

        border: none;

        border-radius: 5px;

        cursor: pointer;

        transition: 0.3s;
      }

      button:hover {
        background: darkblue;

        transform: scale(1.03);
      }

      /* Side Box */
      .info-box {
        background: darkblue;

        color: white;

        padding: 30px;

        margin-top: 50px;

        border-radius: 30px;

        text-align: center;

        height: 100%;
      }

      .info-box i {
        font-size: 70px;

        margin-bottom: 20px;
      }
    </style>
  </head>

  <body>
    <!-- Bootstrap Grid System -->
    <div class="container">
      <div class="row justify-content-center">
        <!-- Left Side -->
        <div class="col-md-4">
          <div class="info-box">
            <i class="bi bi-person-circle"></i>

            <h3>Welcome</h3>

            <p>Create your account using this Bootstrap Registration Form.</p>
          </div>
        </div>

        <!-- Right Side -->
        <div class="col-md-6">
          <div class="form-box">
            <h2>Registration Form</h2>

            <form>
              <!-- Name -->
              <label> Full Name: </label>

              <input type="text" placeholder="Enter Name" />

              <br /><br />

              <!-- Email -->
              <label> Email: </label>

              <input type="email" placeholder="Enter Email" />

              <br /><br />

              <!-- Password -->
              <label> Password: </label>

              <input type="password" placeholder="Enter Password" />

              <br /><br />

              <!-- Phone -->
              <label> Phone Number: </label>

              <input type="tel" placeholder="Enter Phone Number" />

              <br /><br />

              <!-- Gender -->
              <label> Gender: </label>

              <br />

              <input type="radio" name="gender" />
              Male
              <input type="radio" name="gender" />
              Female
              <br /><br />
              <!-- City -->
              <label> City: </label>

              <select>
                <option>Ahmedabad</option>

                <option>Surat</option>

                <option>Vadodara</option>
              </select>

              <br /><br />

              <!-- Checkbox -->
              <input type="checkbox" style="width: auto" />

              I Agree Terms & Conditions

              <br /><br />

              <!-- Button -->
              <button>Register</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
