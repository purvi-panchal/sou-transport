<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Parallax + CSS Sprites</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial;
}

/* PARALLAX SECTION */

.parallax{

    background-image:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb');

    height:100vh;

    background-attachment:fixed;
    background-position:center;
    background-repeat:no-repeat;
    background-size:cover;

    display:flex;
    justify-content:center;
    align-items:center;
}

.parallax h1{
    color:white;
    font-size:60px;
    background:rgba(0,0,0,0.5);
    padding:20px 40px;
    border-radius:10px;
}

/* CONTENT SECTION */

.content{
    padding:80px;
    text-align:center;
    background:#f2f2f2;
}

.content h2{
    margin-bottom:30px;
    font-size:40px;
}

/* SPRITE ICONS */

.container{
    display:flex;
    justify-content:center;
    gap:40px;
    margin-top:40px;
}

.icon{

    width:64px;
    height:64px;

    background-image:url('https://i.imgur.com/4NZ6uLY.png');

    background-repeat:no-repeat;

    border:2px solid black;

    transition:0.3s;
}

.icon:hover{
    transform:scale(1.2);
}

/* ICON POSITIONS */

.home{
    background-position:0 0;
}

.search{
    background-position:-64px 0;
}

.user{
    background-position:-128px 0;
}

/* SECOND PARALLAX */

.parallax2{

    background-image:url('https://images.unsplash.com/photo-1493246507139-91e8fad9978e');

    height:100vh;

    background-attachment:fixed;
    background-position:center;
    background-repeat:no-repeat;
    background-size:cover;

    display:flex;
    justify-content:center;
    align-items:center;
}

.parallax2 h1{
    color:white;
    font-size:50px;
    background:rgba(0,0,0,0.5);
    padding:20px;
    border-radius:10px;
}

</style>
</head>

<body>

<!-- PARALLAX SECTION -->

<div class="parallax">

    <h1>Parallax Effect</h1>

</div>

<!-- CONTENT -->

<div class="content">

    <h2>CSS Image Sprites</h2>

    <p>
        Multiple icons are shown using one sprite image.
    </p>

    <!-- ICONS -->

    <div class="container">

        <div class="icon home"></div>

        <div class="icon search"></div>

        <div class="icon user"></div>

    </div>

</div>

<!-- SECOND PARALLAX -->

<div class="parallax2">

    <h1>Modern Web Design</h1>

</div>

</body>
</html>
