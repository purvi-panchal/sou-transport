<!DOCTYPE html>
<html>
<head>
    <title>Image and Video Hover Effect</title>

    <style>

        body{
            text-align: center;
            background-color: lightgray;
            font-family: Arial;
        }

        /* Image Style */

        .img1{
            width: 300px;
            height: 200px;
            transition: 0.5s;
            border-radius: 10px;
        }

        .img1:hover{
            transform: scale(1.1);
        }

        /* Video Style */

        .video1{
            width: 400px;
            margin-top: 30px;
            transition: 0.5s;
            border-radius: 10px;
        }

        .video1:hover{
            transform: rotate(3deg);
        }

    </style>
</head>

<body>

    <h1>Image and Video Hover Effect</h1>

    <!-- Online Image -->
    <img 
    src="https://images.unsplash.com/photo-1506744038136-46273834b3fb"
    class="img1">

    <br><br>

    <!-- Online Video -->
    <video class="video1" controls>
        <source 
        src="https://www.w3schools.com/html/mov_bbb.mp4"
        type="video/mp4">
    </video>

</body>
</html>
