<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Silver Oak Transport</title>
<link rel="stylesheet" href="style.css">
<script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
  .bypass-btn {
    background: #6c757d;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 8px;
    width: 100%;
    font-size: 14px;
  }
  .bypass-btn:hover { background: #5a6268; }
  .divider {
    text-align: center;
    color: #999;
    margin: 10px 0;
    font-size: 13px;
  }
  #verifyBtn {
    width: 100%;
    margin-top: 8px;
  }
  #faceSection {
    border: 1px dashed #A0522D;
    border-radius: 8px;
    padding: 14px;
    margin-top: 14px;
    background: #fffaf7;
  }
  #faceSection h2 {
    margin-top: 0;
  }
  .status-box {
    margin-top: 10px;
    font-weight: 500;
    min-height: 22px;
  }
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="Silver Oak Logo">
  <h1>Login</h1>
</header>

<div class="form-box">
  <h2>Login with Email</h2>
  <input type="email" id="email" placeholder="Enter your Email" required>
  <input type="password" id="password" placeholder="Enter your Password" required>
  <select id="userType">
    <option value="student">Student</option>
    <option value="teacher">Teacher</option>
  </select>

  <!-- BYPASS BUTTON — seedha login -->
  <div class="divider">— Quick Login —</div>
  <button class="bypass-btn" onclick="bypassLogin()">⚡ Login Without Face Verification</button>

  <!-- FACE VERIFICATION SECTION (Optional) -->
  <div id="faceSection">
    <h2>🔒 ID Face Verification (Optional)</h2>
    <p style="font-size:13px;color:#666;">Upload your university ID card, then take a live photo. Your face on the ID must match your live face.</p>

    <label>Step 1: Upload University ID Card</label>
    <input type="file" id="idUpload" accept="image/*">
    <canvas id="idCanvas" style="display:none;max-width:100%;border-radius:8px;margin-top:8px;"></canvas>

    <label style="margin-top:14px;">Step 2: Live Camera Verification</label>
    <div style="position:relative;display:inline-block;">
      <video id="video" width="320" height="240" autoplay muted style="border-radius:8px;border:2px solid #A0522D;display:block;"></video>
      <canvas id="overlay" width="320" height="240" style="position:absolute;top:0;left:0;pointer-events:none;"></canvas>
    </div>
    <br>
    <button onclick="captureAndVerify()" id="verifyBtn" style="margin-top:10px;" disabled>✅ Verify Face & Login</button>
    <div id="verifyStatus" class="status-box"></div>
  </div>
</div>

<script>
let modelsLoaded = false;
let idDescriptor = null;
const MODEL_URL = 'https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/weights';

// ✅ BYPASS LOGIN — face verification ke bina seedha login
function bypassLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  if (!email || !password) {
    alert('Pehle Email aur Password dalo!');
    return;
  }
  const userType = document.getElementById('userType').value;
  const user = { email, password, userType };
  localStorage.setItem('currentUser', JSON.stringify(user));
  window.location.href = 'booking.html';
}

async function loadModels() {
  const statusEl = document.getElementById('verifyStatus');
  statusEl.style.color = '#666';
  statusEl.innerText = 'Face recognition models load ho rahe hain...';
  try {
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
    ]);
    modelsLoaded = true;
    statusEl.innerText = 'Models ready! Apna ID card upload karo.';
    startCamera();
  } catch(e) {
    statusEl.style.color = 'red';
    statusEl.innerText = 'Models load nahi hue. Upar wala "Quick Login" use karo.';
  }
}

async function startCamera() {
  const video = document.getElementById('video');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
  } catch (e) {
    document.getElementById('verifyStatus').innerText = 'Camera access nahi mila. Permission allow karo ya Quick Login use karo.';
  }
}

document.getElementById('idUpload').addEventListener('change', async function(e) {
  if (!modelsLoaded) {
    document.getElementById('verifyStatus').innerText = 'Models abhi load ho rahe hain, thoda wait karo...';
    return;
  }
  const file = e.target.files[0];
  if (!file) return;
  const img = await faceapi.bufferToImage(file);
  const canvas = document.getElementById('idCanvas');
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  canvas.width = img.width;
  canvas.height = img.height;
  ctx.drawImage(img, 0, 0);
  document.getElementById('verifyStatus').innerText = 'ID card mein face dhundh raha hoon...';
  const detection = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions())
    .withFaceLandmarks()
    .withFaceDescriptor();
  if (!detection) {
    document.getElementById('verifyStatus').style.color = 'red';
    document.getElementById('verifyStatus').innerText = 'ID card mein face nahi mila. Clear photo wala ID upload karo.';
    return;
  }
  idDescriptor = detection.descriptor;
  document.getElementById('verifyStatus').style.color = 'green';
  document.getElementById('verifyStatus').innerText = 'ID face detect ho gaya! Ab "Verify Face & Login" dabao.';
  document.getElementById('verifyBtn').disabled = false;
});

async function captureAndVerify() {
  if (!modelsLoaded || !idDescriptor) {
    alert('Pehle ID card upload karo aur models load hone do.');
    return;
  }
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  if (!email || !password) {
    alert('Email aur Password dono bharo');
    return;
  }
  document.getElementById('verifyStatus').innerText = 'Live face detect ho raha hai...';
  const video = document.getElementById('video');
  const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
    .withFaceLandmarks()
    .withFaceDescriptor();
  if (!detection) {
    document.getElementById('verifyStatus').style.color = 'red';
    document.getElementById('verifyStatus').innerText = 'Camera mein face nahi mila. Camera ke samne seedha dekho.';
    return;
  }
  const distance = faceapi.euclideanDistance(idDescriptor, detection.descriptor);
  const THRESHOLD = 0.55;
  if (distance < THRESHOLD) {
    document.getElementById('verifyStatus').style.color = 'green';
    document.getElementById('verifyStatus').innerText = 'Face verify ho gaya! Login ho raha hai...';
    const userType = document.getElementById('userType').value;
    const user = { email, password, userType };
    localStorage.setItem('currentUser', JSON.stringify(user));
    setTimeout(() => { window.location.href = 'booking.html'; }, 1000);
  } else {
    document.getElementById('verifyStatus').style.color = 'red';
    document.getElementById('verifyStatus').innerText = 'Face ID card se match nahi hua. Sahi ID use karo ya Quick Login try karo.';
  }
}

window.addEventListener('load', () => {
  if (typeof faceapi !== 'undefined') {
    loadModels();
  } else {
    setTimeout(loadModels, 1500);
  }
});
</script>
</body>
</html>
