<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment - Silver Oak Transport</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="logo.png" alt="Silver Oak Logo">
        <h1>Payment</h1>
    </header>

    <div class="form-box">
        <h2>Booking Summary</h2>
        <div id="paymentSummary" style="margin-bottom:18px;line-height:2;"></div>

        <h2>Select Payment Method</h2>
        <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:18px;">
            <label><input type="radio" name="payMethod" value="upi" checked> UPI (GPay / PhonePe / Paytm)</label>
            <label><input type="radio" name="payMethod" value="card"> Credit / Debit Card</label>
            <label><input type="radio" name="payMethod" value="cash"> Pay Cash to Driver</label>
        </div>

        <div id="upiSection">
            <label>UPI ID:</label>
            <input type="text" id="upiId" placeholder="yourname@upi">
        </div>

        <div id="cardSection" style="display:none;">
            <label>Card Number:</label>
            <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19">
            <label>Expiry (MM/YY):</label>
            <input type="text" id="cardExpiry" placeholder="MM/YY" maxlength="5">
            <label>CVV:</label>
            <input type="password" id="cardCvv" placeholder="CVV" maxlength="3">
        </div>

        <div id="cashSection" style="display:none;">
            <p style="color:#A0522D;font-weight:500;">Please pay the exact fare in cash to the driver at pickup.</p>
        </div>

        <button onclick="processPayment()" style="margin-top:16px;">Confirm & Pay</button>
        <button onclick="window.history.back()" style="margin-top:10px;background:#888;">Go Back</button>

        <div id="payStatus" style="margin-top:14px;font-weight:500;"></div>
    </div>

    <script>
    document.querySelectorAll('input[name="payMethod"]').forEach(radio => {
        radio.addEventListener('change', function() {
            document.getElementById('upiSection').style.display = this.value === 'upi' ? 'block' : 'none';
            document.getElementById('cardSection').style.display = this.value === 'card' ? 'block' : 'none';
            document.getElementById('cashSection').style.display = this.value === 'cash' ? 'block' : 'none';
        });
    });

    window.onload = function() {
        const booking = JSON.parse(localStorage.getItem('pendingPayment') || '{}');
        const summaryDiv = document.getElementById('paymentSummary');
        if (booking && booking.fare) {
            summaryDiv.innerHTML = `
                <p><strong>Transport:</strong> ${booking.transport || '--'}</p>
                <p><strong>From:</strong> ${booking.from || '--'} &rarr; <strong>To:</strong> ${booking.to || '--'}</p>
                <p><strong>Seats:</strong> ${(booking.seats || []).join(', ') || '--'}</p>
                <p><strong>Date:</strong> ${booking.date || '--'}</p>
                <p><strong>Slot:</strong> ${booking.slot || '--'}</p>
                <p style="font-size:18px;color:#A0522D;"><strong>Total Fare: ₹${booking.fare}</strong></p>
            `;
        } else {
            summaryDiv.innerHTML = '<p>No booking data found. Please go back and book.</p>';
        }
    };

    function processPayment() {
        const method = document.querySelector('input[name="payMethod"]:checked').value;
        const booking = JSON.parse(localStorage.getItem('pendingPayment') || '{}');
        if (!booking.fare) { alert('No booking found!'); return; }

        if (method === 'upi') {
            const upi = document.getElementById('upiId').value.trim();
            if (!upi) { alert('Please enter UPI ID'); return; }
        } else if (method === 'card') {
            const num = document.getElementById('cardNumber').value.trim();
            const exp = document.getElementById('cardExpiry').value.trim();
            const cvv = document.getElementById('cardCvv').value.trim();
            if (!num || !exp || !cvv) { alert('Please fill all card details'); return; }
        }

        const statusEl = document.getElementById('payStatus');
        statusEl.style.color = 'orange';
        statusEl.innerText = 'Processing payment...';

        setTimeout(() => {
            const history = JSON.parse(localStorage.getItem('bookingHistory') || '[]');
            booking.paymentMethod = method;
            booking.paymentStatus = 'Paid';
            history.push(booking);
            localStorage.setItem('bookingHistory', JSON.stringify(history));
            localStorage.removeItem('pendingPayment');

            statusEl.style.color = 'green';
            statusEl.innerText = 'Payment successful! Booking confirmed.';
            setTimeout(() => { window.location.href = 'booking.html'; }, 1800);
        }, 1500);
    }
    </script>
</body>
</html>
