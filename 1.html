<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image and Video Positioning</title>

    <style>

        body{
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        h1{
            text-align: center;
            margin-top: 20px;
            color: darkblue;
        }

        /* IMAGE POSITIONING */

        .image-container{
            position: relative;
            width: 90%;
            height: 400px;
            margin: 30px auto;
            border: 3px solid black;
            background-color: white;
        }

        .img1{
            position: static;
            width: 150px;
            height: 150px;
        }

        .img2{
            position: relative;
            top: 20px;
            left: 50px;
            width: 150px;
            height: 150px;
        }

        .img3{
            position: absolute;
            top: 100px;
            right: 50px;
            width: 150px;
            height: 150px;
        }

        .img4{
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 120px;
            height: 120px;
            border-radius: 10px;
        }

        /* CENTER IMAGE */

        .center-box{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 300px;
            margin: 30px;
            border: 3px solid blue;
            background-color: white;
        }

        .center-box img{
            width: 200px;
            height: 200px;
        }

        /* VIDEO POSITIONING */

        .video-container{
            position: relative;
            width: 90%;
            height: 500px;
            margin: 30px auto;
            border: 3px solid green;
            background-color: white;
        }

        .video1{
            position: relative;
            top: 20px;
            left: 20px;
        }

        .video2{
            position: absolute;
            top: 150px;
            right: 50px;
        }

        /* BACKGROUND VIDEO */

        .bg-video{
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -1;
            opacity: 0.3;
        }

        .content{
            position: relative;
            z-index: 1;
        }

    </style>
</head>

<body>

    <!-- Background Video -->
    <video autoplay muted loop class="bg-video">
        <source src="video.mp4" type="video/mp4">
    </video>

    <div class="content">

        <h1>Image and Video Positioning in Web Development</h1>

        <!-- IMAGE POSITIONING -->
        <div class="image-container">

            <!-- Static -->
            <img src="https://www.magnific.com/free-photos-vectors/beautiful-nature" class="img1">

            <!-- Relative -->
            <img src="https://www.magnific.com/free-photos-vectors/beautiful-nature" class="img2">

            <!-- Absolute -->
            <img src="ihttps://www.magnific.com/free-photos-vectors/beautiful-nature" class="img3">

            <!-- Fixed -->
            <img src="https://www.magnific.com/free-photos-vectors/beautiful-nature" class="img4">

        </div>

        <!-- CENTER IMAGE -->
        <div class="center-box">
            <img src="image5.jpg">
        </div>

        <!-- VIDEO POSITIONING -->
        <div class="video-container">

            <!-- Relative Video -->
            <video class="video1" width="300" controls>
                <source src="video.mp4" type="video/mp4">
            </video>

            <!-- Absolute Video -->
            <video class="video2" width="300" controls>
                <source src="video.mp4" type="video/mp4">
            </video>

        </div>

    </div>

</body>
</html>
